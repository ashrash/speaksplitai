name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: speaksplit
          POSTGRES_PASSWORD: speaksplit
          POSTGRES_DB: speaksplit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U speaksplit"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Database integration tests
        run: pnpm test:int
        env:
          TEST_DATABASE_URL: postgres://speaksplit:speaksplit@localhost:5432/speaksplit
